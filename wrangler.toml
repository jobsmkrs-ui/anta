name = "anta-website"
compatibility_date = "2024-09-23"

# Deploy the static export folder (./out) as Cloudflare Workers static assets.
# This tells `npx wrangler deploy` to upload everything in ./out/ as static files.
[assets]
directory = "./out"
not_found_handling = "single-page-application"

# Optional: custom routes / headers can go here later.
